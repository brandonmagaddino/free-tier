<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" aria-label="free-tier: it doesn't need much to survive">
  <title>free-tier</title>
  <desc>A cactus mascot planted in a terracotta pot, with the "free-tier" wordmark and the tagline "it doesn't need much to survive". Dark-mode variant.</desc>

  <!-- background bubble -->
  <circle cx="340" cy="130" r="70" fill="#F1EFE8"/>

  <!-- cactus body -->
  <g stroke="#27500A" stroke-width="2" stroke-linejoin="round">
    <rect x="328" y="100" width="24" height="100" rx="12" fill="#639922"/>
    <path d="M308 155 Q308 142 321 142 L328 142 L328 168 L321 168 Q308 168 308 155 Z" fill="#639922"/>
    <path d="M372 148 Q372 135 359 135 L352 135 L352 161 L359 161 Q372 161 372 148 Z" fill="#639922"/>
  </g>

  <!-- spines -->
  <g stroke="#27500A" stroke-width="1.5" stroke-linecap="round">
    <line x1="333" y1="112" x2="329" y2="107"/>
    <line x1="347" y1="112" x2="351" y2="107"/>
    <line x1="333" y1="130" x2="329" y2="125"/>
    <line x1="347" y1="130" x2="351" y2="125"/>
  </g>

  <!-- terracotta pot: rim drawn last, on top of the stem, so the cactus reads as planted -->
  <g stroke="#993C1D" stroke-width="2" stroke-linejoin="round">
    <path d="M308 188 L372 188 L360 222 L320 222 Z" fill="#D85A30"/>
    <rect x="308" y="178" width="64" height="10" rx="3" fill="#D85A30"/>
  </g>

  <!-- wordmark + tagline: lightened for a dark page background -->
  <text x="340" y="250" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="600" fill="#F5F1E8">free-tier</text>
  <text x="340" y="274" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#B8B4AC">it doesn't need much to survive</text>
</svg>
