<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="free-tier logo: a cactus planted in a terracotta pot">
  <title>free-tier</title>
  <desc>A cactus mascot planted inside a terracotta pot, the rim overlapping the base of the stem.</desc>

  <!-- background bubble -->
  <circle cx="120" cy="120" r="70" fill="#F1EFE8"/>

  <!-- cactus body -->
  <g stroke="#27500A" stroke-width="2" stroke-linejoin="round">
    <rect x="108" y="90" width="24" height="100" rx="12" fill="#639922"/>
    <path d="M88,145 Q88,132 101,132 L108,132 L108,158 L101,158 Q88,158 88,145 Z" fill="#639922"/>
    <path d="M152,138 Q152,125 139,125 L132,125 L132,151 L139,151 Q152,151 152,138 Z" fill="#639922"/>
  </g>

  <!-- spines -->
  <g stroke="#27500A" stroke-width="1.5" stroke-linecap="round">
    <line x1="113" y1="102" x2="109" y2="97"/>
    <line x1="127" y1="102" x2="131" y2="97"/>
    <line x1="113" y1="120" x2="109" y2="115"/>
    <line x1="127" y1="120" x2="131" y2="115"/>
  </g>

  <!-- terracotta pot: rim (rect) is drawn last, on top of the stem, so the cactus reads as planted -->
  <g stroke="#993C1D" stroke-width="2" stroke-linejoin="round">
    <path d="M88,178 L152,178 L140,212 L100,212 Z" fill="#D85A30"/>
    <rect x="88" y="168" width="64" height="10" rx="3" fill="#D85A30"/>
  </g>
</svg>
